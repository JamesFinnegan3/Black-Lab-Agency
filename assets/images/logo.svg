<svg width="180" height="50" viewBox="0 0 180 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black Lab Dog Head Icon -->
  <g transform="translate(5, 8)">
    <!-- Head -->
    <ellipse cx="18" cy="18" rx="14" ry="16" fill="#0d0d0d"/>

    <!-- Ear left -->
    <ellipse cx="10" cy="12" rx="5" ry="8" fill="#0d0d0d"/>

    <!-- Ear right -->
    <ellipse cx="26" cy="12" rx="5" ry="8" fill="#0d0d0d"/>

    <!-- Snout -->
    <ellipse cx="18" cy="24" rx="8" ry="6" fill="#0d0d0d"/>

    <!-- Eyes -->
    <circle cx="14" cy="17" r="2.5" fill="white"/>
    <circle cx="22" cy="17" r="2.5" fill="white"/>
    <circle cx="14.5" cy="17.5" r="1.2" fill="#0d0d0d"/>
    <circle cx="22.5" cy="17.5" r="1.2" fill="#0d0d0d"/>

    <!-- Nose -->
    <ellipse cx="18" cy="25" rx="2.5" ry="2" fill="#0d0d0d"/>
    <circle cx="17.5" cy="24.5" r="0.8" fill="#fff" opacity="0.4"/>
  </g>

  <!-- Text: BLACK LAB -->
  <text x="52" y="24" font-family="Space Grotesk, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d0d0d" letter-spacing="0.5">BLACK LAB</text>

  <!-- Text: AGENCY -->
  <text x="52" y="38" font-family="Space Grotesk, Arial, sans-serif" font-size="10" font-weight="500" fill="#525252" letter-spacing="1">AGENCY</text>
</svg>
